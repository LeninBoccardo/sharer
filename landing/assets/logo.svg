<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sharer logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4691ff"/>
    </linearGradient>
  </defs>
  <!-- Three connected nodes forming a triangle: the P2P mesh -->
  <circle cx="32" cy="14" r="6" fill="url(#g)"/>
  <circle cx="14" cy="46" r="6" fill="url(#g)"/>
  <circle cx="50" cy="46" r="6" fill="url(#g)"/>
  <!-- Edges between nodes -->
  <line x1="32" y1="14" x2="14" y2="46" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="14" x2="50" y2="46" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="46" x2="50" y2="46" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
