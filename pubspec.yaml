name: sharer
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management + DI. Used as the composition-root mechanism for the
  # Clean Architecture layers (see docs/v1/architecture.md).
  flutter_riverpod: ^3.3.1

  # mDNS / DNS-SD discovery + announce. Picked over the Flutter team's
  # multicast_dns package because that one is discovery-only (no announce).
  bonsoir: ^6.0.1

  # Network watcher inputs.
  # network_info_plus stays at 7.x because 8.x requires win32 ^6.x,
  # which conflicts with file_picker 11.x's win32 ^5.x pin. Bump
  # together with file_picker (currently file_picker 12 is in beta).
  connectivity_plus: ^7.1.1
  network_info_plus: ^7.0.0

  # Lightweight persistence for device identity, trusted networks, peer cache.
  shared_preferences: ^2.3.3

  # Secret-grade persistence for paired-device PSKs and (slice 5) TLS keys.
  # Backed by Keystore on Android, DPAPI on Windows, Keychain on iOS/macOS.
  flutter_secure_storage: ^10.0.0

  # HMAC-SHA256 for the X-Sharer-Sig request authentication header.
  crypto: ^3.0.6

  # Slice 5.x.4.3: migrated from the EOL `cryptography` 2.x line to the
  # community-maintained `cryptography_plus` fork. Drop-in API
  # (AesGcm.with256bits(), Hmac, Hkdf, Ed25519, X25519, SecretBox,
  # SecretKey all preserved). The original dint.dev / Gohilla
  # `cryptography` 2.x went silent; the Plus fork is actively
  # maintained and is the path most LAN-share apps moved to after
  # hitting the same auto-registration trap we did.
  #
  # Ed25519 long-term identity (slice 4.5), X25519 + HKDF for the LAN
  # pair-invite handshake (slice 4.6), AES-256-GCM for end-to-end chunk
  # encryption (slice 5.3).
  cryptography_plus: ^3.0.0
  # Slice 5.x.4.3: native AES-GCM (javax.crypto.Cipher on Android,
  # CommonCrypto on Apple, BCrypt on Windows). Auto-registers via
  # Flutter plugin discovery in 3.x — there is NO longer a
  # FlutterCryptography.enable() call to make. The boot canary in
  # main.dart logs `AesGcm.with256bits().runtimeType` on every launch
  # — see reference_cryptography_flutter.md for the trap that bit us
  # in 5.3.2 and what to do if the canary shows `_DartAesGcm` again.
  cryptography_flutter_plus: ^3.0.0

  # Self-signed X.509 cert generation for slice 5.1 TLS + cert pinning.
  # Wraps pointycastle's ASN.1 + key-gen primitives — much less code than
  # rolling our own DER encoder.
  basic_utils: ^5.8.2

  # Pairing UI: render the QR offer on the initiator, scan it on the
  # responder. mobile_scanner is camera-based; on desktops without a
  # camera we fall back to the typed-code entry.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Stable random device IDs.
  uuid: ^4.5.1

  # Per-platform device name resolution (default identity name).
  # Capped at 12.x because file_picker 11.x pins win32 ^5.x, while
  # device_info_plus 13.x requires win32 ^6.x. Bump to 13 once
  # file_picker catches up.
  device_info_plus: ^12.4.0

  # HTTP transport. shelf for the receiving server; dart:io HttpClient
  # for sending (already available, no extra dep).
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # File picking on send + Downloads dir resolution on receive.
  file_picker: ^11.0.2
  path_provider: ^2.1.5

  # MIME sniffing for outgoing Content-Type header.
  mime: ^2.0.0

  # Slice 5.2.1: cross-platform local notifications. Used for the
  # incoming-transfer + pair-invite surfaces. Android channel posture
  # (MIN for idle / LOW for active) is configured in
  # data/notifications/notification_service.dart per docs/v1/architecture.md
  # "Background behavior".
  flutter_local_notifications: ^21.0.0

  # Slice 5.2.2: Android foreground service so the HTTP server +
  # mDNS listener stay alive when the user backgrounds the app and
  # paired peers can still send files. Lifecycle is bound to
  # `pairedDevicesStreamProvider` (start when count > 0, stop when
  # 0). No-op on Windows / iOS — see
  # data/notifications/foreground_service_controller.dart.
  flutter_foreground_task: ^9.2.2

  # Slice 5.2.3: Windows tray icon + close-to-tray. Closing the
  # window hides it; only the tray menu's "Quit" actually exits the
  # process. tray_manager surfaces tray click + menu events;
  # window_manager intercepts the close button + lets us hide / show
  # the window. Both are no-ops on platforms other than Windows /
  # macOS / Linux.
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

  # Slice 5.2.4: launches a saved file in the OS default handler when
  # the user taps the "Open" action on a transfer-completed
  # notification. Cross-platform: Android Intent.ACTION_VIEW, Windows
  # ShellExecute, macOS / Linux equivalents.
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Slice 5.2.3: tray_manager loads its icon from the runtime assets
    # bundle. .ico is the only format Windows' Shell_NotifyIcon API
    # accepts; the same file is currently a copy of the launcher icon
    # and will be replaced once we have proper monochrome tray art.
    - assets/tray_icon.ico

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
