# Slice 5.x.5 (Phase 1) — deploy the static landing page to GitHub Pages.
#
# Activation: Settings → Pages → Source = "Deploy from a branch", branch =
# "gh-pages", folder = "/ (root)". The first push touching `landing/**`
# after activation will populate the gh-pages branch automatically.
#
# Disabling: delete this file. The page is still hostable via Cloudflare
# Pages or Netlify drop without any GH Actions involvement.

name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'
  # Manual trigger from the Actions tab — useful for re-deploying after
  # changing GH Pages settings.
  workflow_dispatch: {}

# Single deploy job at a time; cancel any in-flight run when a new push
# arrives so we don't race two deploys onto the same branch.
concurrency:
  group: landing-deploy
  cancel-in-progress: true

permissions:
  contents: write  # peaceiris/actions-gh-pages writes to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          publish_branch: gh-pages
          # Allow custom domains by dropping a CNAME file into landing/.
          # No-op if no CNAME exists.
          cname: ${{ vars.LANDING_CNAME }}
          commit_message: 'chore(landing): deploy ${{ github.sha }}'
