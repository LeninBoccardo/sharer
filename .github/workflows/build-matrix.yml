# Slice 5.x.5 phases 2 + 3 — verify the app compiles cleanly on every
# desktop platform we claim to support. Catches dependency resolution
# failures + linker errors without needing local hardware.
#
# What this DOES catch:
#   - Missing platform-specific implementations of any plugin.
#   - Native code that fails to compile on a given platform.
#   - pubspec.lock drift between platforms.
#
# What this DOES NOT catch (real-device validation still required):
#   - Bonsoir browse silently returning no results (mDNS gates).
#   - flutter_secure_storage Keychain / libsecret runtime failures.
#   - Notifications not being shown.
#   - The boot canary's runtime type — that's logged at first launch,
#     not at build time.

name: Build matrix

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'android/**'
      - '.github/workflows/build-matrix.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'android/**'
  workflow_dispatch: {}

# Cancel in-progress runs on the same ref when a new push arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- Static analysis + tests (one Linux runner) ----
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ---------------- macOS build ----------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Build macOS (debug, unsigned)
        run: flutter build macos --debug --no-pub
        # Debug build to skip the code-signing gate. Catches link errors
        # without requiring a Developer ID. Release-signed builds are an
        # out-of-scope follow-up.
      - name: Verify .app bundle exists
        run: |
          set -euo pipefail
          test -d "build/macos/Build/Products/Debug/sharer.app"
          echo "macOS .app built successfully."

  # ---------------- Linux build (Phase 3 wires this up) ----------
  # Job is defined here so the workflow file is one-shot when phase 3
  # lands. Currently a no-op `echo` until phase 3 adds the .desktop
  # file + AppImage script.
  build-linux:
    name: Build Linux + AppImage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Build Linux (release)
        run: flutter build linux --release --no-pub
      - name: Verify Linux bundle exists
        run: |
          set -euo pipefail
          test -d "build/linux/x64/release/bundle"
          test -f "build/linux/x64/release/bundle/sharer"
          echo "Linux bundle built successfully."
      # AppImage packaging is wired by phase 3 (linux-support branch).
      # When that lands, this step uploads the .AppImage artifact.
      - name: Build AppImage (if packaging script exists)
        if: hashFiles('linux/packaging/build-appimage.sh') != ''
        run: |
          chmod +x linux/packaging/build-appimage.sh
          linux/packaging/build-appimage.sh
      - name: Upload AppImage artifact
        if: hashFiles('build/linux/x64/release/Sharer-*.AppImage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sharer-linux-appimage
          path: build/linux/x64/release/Sharer-*.AppImage
          retention-days: 14
